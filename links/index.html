<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orangy — Enlaces</title>
<meta name="description" content="Todos los enlaces de Orangy Integrated Marketing: portafolio, contacto y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#E5501C;
  --gris:#545454;
  --gris-claro:#A6A6A6;
  --papel:#F4F1EB;
  --hairline:#E3DED5;
  --naranja-vivo:#F27405;
  --teal:#32A6A6;
  --aqua:#99E9F2;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',sans-serif;
  background:var(--papel);
  color:var(--gris);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:64px 24px 48px;
  -webkit-font-smoothing:antialiased;
}
.tarjeta{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:180px;height:auto;margin-bottom:28px}
.lema{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gris-claro);margin-bottom:20px}

.barra{display:flex;height:5px;width:200px;margin-bottom:44px}
.barra span{transform:scaleX(0);transform-origin:left;animation:crecer 1s var(--ease) forwards}
.barra span:nth-child(1){background:var(--naranja);flex:48.3}
.barra span:nth-child(2){background:var(--naranja-vivo);flex:15.5;animation-delay:.12s}
.barra span:nth-child(3){background:var(--teal);flex:27.4;animation-delay:.24s}
.barra span:nth-child(4){background:var(--aqua);flex:6.8;animation-delay:.36s}
@keyframes crecer{to{transform:scaleX(1)}}

.botones{width:100%;display:grid;gap:14px}
.boton{
  display:block;width:100%;padding:17px 24px;
  border:1px solid var(--gris);border-radius:999px;
  font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gris);text-decoration:none;
  transition:background .3s,color .3s,border-color .3s,transform .3s;
}
.boton:hover{background:var(--gris);color:var(--papel);transform:translateY(-2px)}
.boton.principal{background:var(--naranja);border-color:var(--naranja);color:var(--papel)}
.boton.principal:hover{background:var(--naranja-vivo);border-color:var(--naranja-vivo)}

.pie{margin-top:56px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gris-claro)}

@media(prefers-reduced-motion:reduce){
  .barra span{animation:none;transform:scaleX(1)}
  .boton{transition:none}
}
</style>
</head>
<body>
<main class="tarjeta">
  <img class="logo" src="../img/logo-orangy.png" alt="Orangy Integrated Marketing">
  <p class="lema">Brand Intelligence &amp; Desarrollo de Negocios</p>
  <div class="barra"><span></span><span></span><span></span><span></span></div>

  <nav class="botones" aria-label="Enlaces de Orangy">
    <a class="boton principal" href="../">Ver portafolio</a>
    <a class="boton" href="https://wa.me/525571903021?text=Hola%2C%20me%20gustar%C3%ADa%20platicar%20de%20mi%20proyecto" target="_blank" rel="noopener">Platiquemos por WhatsApp</a>
    <a class="boton" href="https://orangy.com.mx" target="_blank" rel="noopener">Sitio web</a>
    <a class="boton" href="mailto:hola@orangy.com.mx">Escríbenos un correo</a>
    <!-- Pendientes de March (agregar cuando pase las URLs exactas):
    <a class="boton" href="URL_YOUTUBE" target="_blank" rel="noopener">Canal de YouTube</a>
    <a class="boton" href="URL_INSTAGRAM" target="_blank" rel="noopener">Instagram</a>
    -->
  </nav>

  <p class="pie">No por velocidad. Por dirección.</p>
</main>
</body>
</html>
