<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Brief Estratégico — Orangy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja:#E5521C;
    --navy:#1A5573;
    --naranja2:#F27405;
    --teal:#32A6A6;
    --aqua:#99E9F2;
    --fondo:#FAF6F1;
    --tinta:#2B2B2B;
    --tinta-suave:#8C857C;
    --hairline:#E6DFD5;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--fondo);
    color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Barra de progreso (línea de colores Orangy) ---------- */
  .progreso{position:fixed;top:0;left:0;right:0;height:3px;z-index:50}
  .progreso .linea{position:absolute;inset:0;display:flex;opacity:.14}
  .progreso .linea.activa{
    opacity:1;clip-path:inset(0 100% 0 0);
    transition:clip-path 1.1s var(--ease);
  }
  .progreso .seg1{width:48%;background:var(--naranja)}
  .progreso .seg2{width:15.5%;background:var(--naranja2)}
  .progreso .seg3{width:27.4%;background:var(--teal)}
  .progreso .seg4{width:9.1%;background:var(--aqua)}

  /* ---------- Marca y estado en esquinas ---------- */
  .marca-esquina{position:fixed;top:26px;left:32px;z-index:40}
  .marca-esquina img{width:88px;display:block;opacity:.85}
  .estado{
    position:fixed;top:28px;right:34px;z-index:40;text-align:right;
    font-size:.62rem;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--tinta-suave);
    line-height:1.9;
  }
  .estado .contador{color:var(--naranja)}
  .btn-reiniciar{
    position:fixed;bottom:22px;left:32px;z-index:40;
    font-family:'Montserrat',sans-serif;
    font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:#C1B9AD;background:none;border:none;cursor:pointer;padding:6px;
    transition:color .3s ease;
  }
  .btn-reiniciar:hover{color:var(--naranja)}

  /* ---------- Marco de pantalla ---------- */
  .escenario{position:fixed;inset:0;overflow-y:auto}
  .pantalla{
    min-height:100%;
    display:flex;flex-direction:column;
    align-items:flex-start;justify-content:center;
    max-width:760px;margin:0 auto;
    padding:110px 8vw 90px;
    opacity:1;transition:opacity .35s ease;
  }
  .pantalla.saliendo{opacity:0}
  .pantalla.centrada{align-items:center;text-align:center}

  .rev{
    opacity:0;transform:translateY(14px);
    animation:revelar 1s var(--ease) forwards;
  }
  @keyframes revelar{to{opacity:1;transform:translateY(0)}}
  .palabra{opacity:0;animation:aparecer .9s var(--ease) forwards}
  @keyframes aparecer{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .rev,.palabra{animation-duration:.01s !important;animation-delay:0s !important}
  }

  /* ---------- Bienvenida ---------- */
  .logo-principal{width:min(190px,42vw);margin-bottom:48px}
  .eyebrow{
    font-size:.66rem;font-weight:600;letter-spacing:.3em;
    text-transform:uppercase;color:var(--tinta-suave);
    margin-bottom:24px;
  }
  .bloque-bienvenida{display:flex;gap:28px;align-items:stretch;margin-bottom:52px}
  .linea-acento{flex:none;display:flex;flex-direction:column;width:3px}
  .linea-acento span:nth-child(1){height:48%;background:var(--naranja)}
  .linea-acento span:nth-child(2){height:15.5%;background:var(--naranja2)}
  .linea-acento span:nth-child(3){height:27.4%;background:var(--teal)}
  .linea-acento span:nth-child(4){height:9.1%;background:var(--aqua)}
  .texto-bienvenida{
    max-width:600px;
    font-size:clamp(1.15rem,2.3vw,1.5rem);
    font-weight:400;line-height:1.5;color:var(--tinta);
  }
  .texto-bienvenida .enfasis{color:var(--naranja);font-weight:700}
  .texto-bienvenida .firme{font-weight:600}
  .texto-bienvenida .navy{color:var(--navy);font-weight:600}

  .campo-nombre{margin-bottom:44px}
  .campo-nombre label{
    display:block;font-size:.62rem;font-weight:600;letter-spacing:.24em;
    text-transform:uppercase;color:var(--tinta-suave);margin-bottom:12px;
  }
  .campo-nombre input{
    font-family:'Montserrat',sans-serif;
    font-size:1.25rem;font-weight:500;color:var(--tinta);
    background:transparent;border:none;border-bottom:1px solid var(--hairline);
    padding:6px 2px 10px;width:min(380px,80vw);outline:none;
    transition:border-color .4s ease;
  }
  .campo-nombre input:focus{border-bottom-color:var(--naranja)}
  .campo-nombre input::placeholder{color:#C9C1B6;font-weight:400}

  /* ---------- Botones ---------- */
  .btn{
    font-family:'Montserrat',sans-serif;
    font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    border:none;border-radius:6px;cursor:pointer;
    padding:17px 44px;
    background:var(--naranja);color:#FAF6F1;
    transition:background .3s ease,transform .3s var(--ease),opacity .3s ease;
  }
  .btn:hover{background:#cf4715;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-fantasma{background:transparent;color:var(--tinta-suave);padding:17px 20px}
  .btn-fantasma:hover{background:transparent;color:var(--tinta)}

  /* ---------- Filtro A/B ---------- */
  .titulo-filtro{
    font-size:clamp(1.45rem,3vw,2.05rem);
    font-weight:600;line-height:1.45;margin-bottom:52px;max-width:640px;
  }
  .opciones-ab{display:flex;gap:22px;flex-wrap:wrap}
  .tarjeta-ab{
    font-family:'Montserrat',sans-serif;text-align:left;cursor:pointer;
    background:transparent;border:1px solid var(--hairline);border-radius:10px;
    padding:30px 34px;width:min(300px,80vw);
    transition:border-color .35s ease,background .35s ease,transform .35s var(--ease);
  }
  .tarjeta-ab:hover{border-color:var(--naranja);transform:translateY(-2px)}
  .tarjeta-ab.elegida{border-color:var(--naranja);background:rgba(229,82,28,.06)}
  .tarjeta-ab .letra{
    font-size:.62rem;font-weight:700;letter-spacing:.26em;
    color:var(--naranja);text-transform:uppercase;display:block;margin-bottom:10px;
  }
  .tarjeta-ab .titulo{font-size:1.05rem;font-weight:600;color:var(--tinta)}

  /* ---------- Pregunta ---------- */
  .num-pregunta{
    font-size:.68rem;font-weight:700;letter-spacing:.26em;
    color:var(--naranja);margin-bottom:22px;text-transform:uppercase;
  }
  .texto-pregunta{
    font-size:clamp(1.45rem,3vw,2.05rem);
    font-weight:600;line-height:1.45;margin-bottom:18px;
  }
  .muletas{
    font-size:.82rem;font-weight:400;line-height:1.7;
    color:var(--tinta-suave);margin-bottom:40px;max-width:560px;
  }
  .muletas b{font-weight:600;color:#6E675E}
  .sin-muletas{margin-bottom:40px}

  textarea{
    font-family:'Montserrat',sans-serif;
    font-size:1.05rem;font-weight:400;line-height:1.7;color:var(--tinta);
    width:100%;min-height:96px;
    background:transparent;border:none;border-bottom:1px solid var(--hairline);
    padding:6px 2px 14px;resize:none;outline:none;overflow:hidden;
    transition:border-color .4s ease;
  }
  textarea:focus{border-bottom-color:var(--naranja)}
  textarea::placeholder{color:#C9C1B6}

  .nav-pregunta{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;margin-top:56px;
  }
  .pista-enter{font-size:.62rem;color:#B5AC9F;letter-spacing:.08em;margin-top:18px}

  /* ---------- Puente ---------- */
  .texto-puente{
    font-size:clamp(1.5rem,3.2vw,2.2rem);
    font-weight:500;line-height:1.55;
    max-width:680px;color:var(--tinta);
  }
  .linea-puente{display:flex;width:56px;height:3px;margin-bottom:44px}
  .linea-puente span:nth-child(1){width:48%;background:var(--naranja)}
  .linea-puente span:nth-child(2){width:15.5%;background:var(--naranja2)}
  .linea-puente span:nth-child(3){width:27.4%;background:var(--teal)}
  .linea-puente span:nth-child(4){width:9.1%;background:var(--aqua)}
  .nav-puente{margin-top:64px;display:flex;gap:14px;align-items:center}

  /* ---------- Escalas ---------- */
  .grupo-escala{width:100%;margin-bottom:46px}
  .grupo-escala .enunciado{
    font-size:1.15rem;font-weight:600;line-height:1.5;margin-bottom:26px;
  }
  .fila-escala{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .etiqueta-extremo{
    font-size:.68rem;font-weight:500;color:var(--tinta-suave);
    max-width:110px;line-height:1.5;
  }
  .etiqueta-extremo.der{text-align:right}
  .puntos{display:flex;gap:14px}
  .punto{
    font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:600;
    width:46px;height:46px;border-radius:50%;cursor:pointer;
    background:transparent;border:1px solid var(--hairline);color:var(--tinta-suave);
    transition:all .3s ease;
  }
  .punto:hover{border-color:var(--naranja);color:var(--naranja)}
  .punto.activo{background:var(--naranja);border-color:var(--naranja);color:#FAF6F1}

  /* ---------- Casillas ---------- */
  .grupo-casillas{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:12px;width:100%;
  }
  .casilla{
    display:flex;gap:14px;align-items:flex-start;cursor:pointer;
    border:1px solid var(--hairline);border-radius:10px;
    padding:16px 18px;background:transparent;
    transition:border-color .3s ease,background .3s ease;
  }
  .casilla:hover{border-color:#D8CFC2}
  .casilla.marcada{border-color:var(--naranja);background:rgba(229,82,28,.05)}
  .casilla input{display:none}
  .cuadro{
    flex:none;width:18px;height:18px;margin-top:2px;border-radius:4px;
    border:1.5px solid #C9C1B6;position:relative;transition:all .25s ease;
  }
  .casilla.marcada .cuadro{background:var(--naranja);border-color:var(--naranja)}
  .casilla.marcada .cuadro::after{
    content:'';position:absolute;left:5px;top:1.5px;width:4px;height:9px;
    border:solid #FAF6F1;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .casilla .textos{display:flex;flex-direction:column;gap:4px}
  .casilla .nombre{font-size:.88rem;font-weight:600;line-height:1.4}
  .casilla .giro{font-size:.7rem;font-weight:400;color:var(--tinta-suave);line-height:1.5}
  .subtitulo-grupo{
    font-size:.66rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--navy);margin-bottom:24px;
  }

  /* ---------- Final ---------- */
  .naranjita{font-size:1.5rem;margin-top:38px}
  .nav-final{margin-top:56px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
</style>
</head>

/* Numeración de avance: cada pantalla con captura cuenta una vez
   (las dos de casillas comparten el número 5.6). */
let totalPreguntas = 0;
{
  const vistos = new Set();
  PANTALLAS.forEach(p=>{
    if(['pregunta','escala','casillas'].includes(p.tipo)){
      const clave = p.numeroCompartido || p.id;
      if(!vistos.has(clave)){ vistos.add(clave); totalPreguntas++; }
    }
  });
  let n = 0; const asignados = {};
  PANTALLAS.forEach(p=>{
    if(['pregunta','escala','casillas'].includes(p.tipo)){
      const clave = p.numeroCompartido || p.id;
      if(!(clave in asignados)){ asignados[clave] = ++n; }
      p.numero = asignados[clave];
    }
  });
}

const CLAVE = 'briefOrangyV1';
let estado = { indice:0, nombre:'', variante:null, respuestas:{} };
try{
  const guardado = JSON.parse(localStorage.getItem(CLAVE));
  if(guardado && typeof guardado.indice === 'number') estado = guardado;
}catch(e){}

function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(estado)); }catch(e){} }
function reiniciar(){
  if(confirm('¿Empezar un brief nuevo? Se borrará todo lo capturado.')){
    localStorage.removeItem(CLAVE);
    estado = { indice:0, nombre:'', variante:null, respuestas:{} };
    render();
  }
}

================================================================ */
const $pantalla = document.getElementById('pantalla');
const $estado = document.getElementById('estado');
const $marca = document.getElementById('marcaEsquina');
const $reiniciar = document.getElementById('btnReiniciar');

function textoDe(p){
  if(p.texto) return p.texto;
  return estado.variante === 'B' ? p.textoB : p.textoA;
}
function muletasDe(p){
  if(p.muletas) return p.muletas;
  if(p.muletasA || p.muletasB) return estado.variante === 'B' ? p.muletasB : p.muletasA;
  return null;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(direccionAtras){
  const p = PANTALLAS[estado.indice];
  const interna = p.tipo !== 'bienvenida';
  $marca.style.display = interna ? 'block' : 'none';
  $reiniciar.style.display = interna ? 'block' : 'none';

  /* Estado esquina: bloque + avance de preguntas */
  if(interna && p.bloque){
    $estado.innerHTML = `Bloque ${p.bloque} de 6 · ${BLOQUES[p.bloque]}`;
    $estado.style.display = 'block';
  } else if(p.tipo === 'filtro'){
    $estado.innerHTML = 'Para empezar';
    $estado.style.display = 'block';
  } else {
    $estado.style.display = 'none';
  }

  /* Barra de progreso */
  const pct = Math.max(4, Math.round(estado.indice / (PANTALLAS.length-1) * 100));
  document.getElementById('progresoActivo').style.clipPath = `inset(0 ${100-pct}% 0 0)`;

  $pantalla.classList.toggle('centrada', ['puente','final'].includes(p.tipo));
  $pantalla.innerHTML = plantilla(p);
  $pantalla.scrollTop = 0;
  document.querySelector('.escenario').scrollTop = 0;
  montar(p);
}

function irA(indice){
  if(indice < 0 || indice >= PANTALLAS.length) return;
  const atras = indice < estado.indice;
  $pantalla.classList.add('saliendo');
  setTimeout(()=>{
    estado.indice = indice; guardar();
    $pantalla.classList.remove('saliendo');
    render(atras);
  }, 360);
}
function siguiente(){ irA(estado.indice + 1); }
function anterior(){ irA(estado.indice - 1); }

/* ---------- Plantillas por tipo ---------- */
function plantilla(p){
  if(p.tipo === 'bienvenida') return plantillaBienvenida();
  if(p.tipo === 'filtro') return plantillaFiltro(p);
  if(p.tipo === 'puente') return plantillaPuente(p);
  if(p.tipo === 'pregunta') return plantillaPregunta(p);
  if(p.tipo === 'escala') return plantillaEscala(p);
  if(p.tipo === 'casillas') return plantillaCasillas(p);
  if(p.tipo === 'final') return plantillaFinal(p);
  return '';
}

    <input id="nombreCliente" type="text" placeholder="Escribe el nombre aquí" autocomplete="off" value="${esc(estado.nombre)}">
  </div>
  <button class="btn rev" style="animation-delay:1.55s" onclick="siguiente()">¿Empezamos?</button>`;
}

function plantillaFiltro(p){
  const el = v => estado.variante === v ? ' elegida' : '';
  return `
  <h2 class="titulo-filtro rev" style="animation-delay:.15s">${p.texto}</h2>
  <div class="opciones-ab rev" style="animation-delay:.45s">
    <button class="tarjeta-ab${el('A')}" onclick="elegirVariante('A')">
      <span class="letra">A</span><span class="titulo">Ya está operando</span>
    </button>
    <button class="tarjeta-ab${el('B')}" onclick="elegirVariante('B')">
      <span class="letra">B</span><span class="titulo">Va iniciando</span>
    </button>
  </div>
  <div class="nav-pregunta rev" style="animation-delay:.7s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <span></span>
  </div>`;
}
function elegirVariante(v){
  estado.variante = v; guardar();
  document.querySelectorAll('.tarjeta-ab').forEach(t=>t.classList.remove('elegida'));
  (v==='A' ? document.querySelectorAll('.tarjeta-ab')[0] : document.querySelectorAll('.tarjeta-ab')[1]).classList.add('elegida');
  setTimeout(siguiente, 450);
}

function plantillaPuente(p){
  const palabras = p.texto.split(' ');
  const html = palabras.map((w,i)=>`<span class="palabra" style="animation-delay:${(.4 + i*.09).toFixed(2)}s">${esc(w)}</span>`).join(' ');
  const fin = .4 + palabras.length*.09 + .5;
  return `
  <div class="linea-puente rev" style="animation-delay:.15s"><span></span><span></span><span></span><span></span></div>
  <p class="texto-puente">${html}</p>
  <div class="nav-puente rev" style="animation-delay:${fin.toFixed(2)}s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <button class="btn" onclick="siguiente()">Continuar</button>
  </div>`;
}

function plantillaPregunta(p){
  const muletas = muletasDe(p);
  const valor = estado.respuestas[p.id] || '';
  return `
  <p class="num-pregunta rev" style="animation-delay:.15s">Pregunta ${p.numero} de ${totalPreguntas}</p>
  <h2 class="texto-pregunta rev" style="animation-delay:.35s">${textoDe(p)}</h2>
  ${muletas ? `<p class="muletas rev" style="animation-delay:.6s">${muletas}</p>` : '<div class="sin-muletas"></div>'}
  <textarea class="rev" style="animation-delay:.8s" rows="3" id="respuesta"
    placeholder="Escribe aquí la respuesta…">${esc(valor)}</textarea>
  <div class="nav-pregunta rev" style="animation-delay:1s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <button class="btn" onclick="siguiente()">Siguiente →</button>
  </div>
  <p class="pista-enter rev" style="animation-delay:1.2s">Enter ↵ para continuar · Shift + Enter para salto de línea</p>`;
}

function plantillaEscala(p){
  const filas = p.escalas.map((e,idx)=>{
    const val = estado.respuestas[e.id];
    const puntos = [1,2,3,4,5].map(n=>
      `<button class="punto${val===n?' activo':''}" onclick="marcarEscala('${e.id}',${n},this)">${n}</button>`).join('');
    return `
    <div class="grupo-escala rev" style="animation-delay:${(.5 + idx*.25).toFixed(2)}s">
      <p class="enunciado">${e.texto}</p>
      <div class="fila-escala">
        <span class="etiqueta-extremo">${e.izq}</span>
        <div class="puntos">${puntos}</div>
        <span class="etiqueta-extremo der">${e.der}</span>
      </div>
    </div>`;
  }).join('');
  return `
  <p class="num-pregunta rev" style="animation-delay:.15s">Pregunta ${p.numero} de ${totalPreguntas}</p>
  <h2 class="texto-pregunta rev" style="animation-delay:.3s">${p.titulo}</h2>
  <div class="sin-muletas"></div>
  ${filas}
  <div class="nav-pregunta rev" style="animation-delay:1.1s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <button class="btn" onclick="siguiente()">Siguiente →</button>
  </div>`;
}
function marcarEscala(id, n, btn){
  estado.respuestas[id] = n; guardar();
  btn.parentElement.querySelectorAll('.punto').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
}

function plantillaCasillas(p){
  const marcadas = estado.respuestas[p.id] || [];
  const casillas = p.opciones.map((o,i)=>`
    <label class="casilla${marcadas.includes(o.t)?' marcada':''}">
      <input type="checkbox" data-item="${esc(o.t)}" ${marcadas.includes(o.t)?'checked':''}>
      <span class="cuadro"></span>
      <span class="textos"><span class="nombre">${esc(o.t)}</span><span class="giro">${esc(o.g)}</span></span>
    </label>`).join('');
  return `
  <p class="num-pregunta rev" style="animation-delay:.15s">Pregunta ${p.numero} de ${totalPreguntas}</p>
  <h2 class="texto-pregunta rev" style="animation-delay:.3s">${p.titulo}</h2>
  <p class="subtitulo-grupo rev" style="animation-delay:.45s">${p.subtitulo}</p>
  <div class="grupo-casillas rev" style="animation-delay:.6s" id="grupoCasillas">${casillas}</div>
  <div class="nav-pregunta rev" style="animation-delay:.85s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <button class="btn" onclick="siguiente()">Siguiente →</button>
  </div>`;
}

function plantillaFinal(p){
  const palabras = p.texto.split(' ');
  const html = palabras.map((w,i)=>`<span class="palabra" style="animation-delay:${(.4 + i*.09).toFixed(2)}s">${esc(w)}</span>`).join(' ');
  const fin = .4 + palabras.length*.09 + .5;
  return `
  <div class="linea-puente rev" style="animation-delay:.15s"><span></span><span></span><span></span><span></span></div>
  <p class="texto-puente">${html}</p>
  <p class="naranjita rev" style="animation-delay:${(fin+.2).toFixed(2)}s">🍊</p>
  <div class="nav-final rev" style="animation-delay:${(fin+.4).toFixed(2)}s">
    <button class="btn btn-fantasma" onclick="anterior()">← Anterior</button>
    <button class="btn" onclick="exportar()">Generar documento del brief</button>
  </div>`;
}

/* ---------- Comportamiento tras render ---------- */
function montar(p){
  if(p.tipo === 'bienvenida'){
    const input = document.getElementById('nombreCliente');
    input.addEventListener('input', ()=>{ estado.nombre = input.value; guardar(); });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') siguiente(); });
  }
  if(p.tipo === 'pregunta'){
    const ta = document.getElementById('respuesta');
    const ajustar = ()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
    ajustar();
    ta.addEventListener('input', ()=>{ estado.respuestas[p.id] = ta.value; guardar(); ajustar(); });
    ta.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); siguiente(); }
    });
    ta.focus({preventScroll:true});
  }
  if(p.tipo === 'casillas'){
    document.querySelectorAll('#grupoCasillas input').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        const lista = new Set(estado.respuestas[p.id] || []);
        if(chk.checked) lista.add(chk.dataset.item); else lista.delete(chk.dataset.item);
        estado.respuestas[p.id] = [...lista]; guardar();
        chk.closest('.casilla').classList.toggle('marcada', chk.checked);
      });
    });
  }
}

/* Enter global (fuera de textarea/input) avanza */
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  const tag = document.activeElement.tagName;
  if(tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') return;
  const p = PANTALLAS[estado.indice];
  if(['puente','pregunta','escala','casillas','filtro'].includes(p.tipo)){
    if(p.tipo === 'filtro' && !estado.variante) return;
    siguiente();
  }
});

/* ================================================================
   EXPORTACIÓN A MARKDOWN
================================================================ */
function exportar(){
  const hoy = new Date();
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fecha = `${hoy.getDate()} de ${meses[hoy.getMonth()]} de ${hoy.getFullYear()}`;
  const nombre = (estado.nombre || 'Sin nombre').trim();
  const tipo = estado.variante === 'B' ? 'Va iniciando' : (estado.variante === 'A' ? 'Ya opera' : 'Sin definir');

  let md = `BRIEF ESTRATÉGICO ORANGY\nCliente: ${nombre}\nTipo de negocio: ${tipo}\nFecha: ${fecha}\n`;

  let bloqueActual = 0;
  PANTALLAS.forEach(p=>{
    if(!['pregunta','escala','casillas'].includes(p.tipo)) return;
    if(p.bloque !== bloqueActual){
      bloqueActual = p.bloque;
      md += `\nBLOQUE ${bloqueActual} — ${BLOQUES[bloqueActual].toUpperCase()}\n`;
    }
    if(p.tipo === 'pregunta'){
      const r = (estado.respuestas[p.id] || '').trim();
      md += `\nP: ${sinHTML(textoDe(p))}\nR: ${r || '—'}\n`;
    }
    if(p.tipo === 'escala'){
      p.escalas.forEach(e=>{
        const v = estado.respuestas[e.id];
        md += `\nP: ${e.texto} (1 = ${e.izq} · 5 = ${e.der})\nR: ${v ? v + '/5' : '—'}\n`;
      });
    }
    if(p.tipo === 'casillas'){
      const lista = estado.respuestas[p.id] || [];
      md += `\nP: Materiales que su marca podría necesitar — ${p.subtitulo}\n`;
      md += lista.length ? lista.map(x=>`- ${x}`).join('\n') + '\n' : 'R: — (ninguno marcado)\n';
    }
  });

  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const nombreArchivo = nombre === 'Sin nombre' ? 'Cliente' : nombre.replace(/[^\p{L}\p{N}]+/gu,'_');
  a.download = `Brief_Orangy_${nombreArchivo}.md`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function sinHTML(s){ const d = document.createElement('div'); d.innerHTML = s; return d.textContent; }

render();
</script>
</body>
</html>
